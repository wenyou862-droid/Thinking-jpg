[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "voting-system"
version = "0.1.0"
description = "A command-line tool for collecting friends' opinions on purchases"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
include = ["voting_system*"]

[dependency-groups]
dev = [
    "ruff>=0.16.8",
]
